name: Build and Push VDF.Web

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Log in to Tencent Cloud Registry
        uses: docker/login-action@v4
        with:
          registry: ccr.ccs.tencentyun.com
          username: "715252590"
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push vdf-web
        env:
          IMAGE: ccr.ccs.tencentyun.com/xarchive/vdf-web
          VERSION: ${{ github.ref_name }}
        run: |
          # Build into Docker's local image store, then use `docker push`. Unlike
          # the Buildx registry exporter, this publishes a Docker schema-2 image
          # manifest instead of an OCI manifest/index in Tencent Cloud Registry.
          docker build \
            --file VDF.Web/Dockerfile \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$VERSION" \
            .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"

          # Do not silently regress to OCI-Image-v1/OCI-Image-List-v1 again.
          media_type="$(docker manifest inspect "$IMAGE:$VERSION" | jq -r '.mediaType')"
          test "$media_type" = "application/vnd.docker.distribution.manifest.v2+json" || {
            echo "Unexpected pushed manifest media type: $media_type" >&2
            exit 1
          }
