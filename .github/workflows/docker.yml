name: Build and Push VDF.Web

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Tencent Cloud Registry
        uses: docker/login-action@v4
        with:
          registry: ccr.ccs.tencentyun.com
          username: "715252590"
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push vdf-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: VDF.Web/Dockerfile
          platforms: linux/amd64
          push: true
          # TCR expects a runnable Docker image manifest. Buildx provenance/SBOM
          # attestations wrap even a single-platform build in an OCI image index,
          # which TCR displays as OCI-Image-List-v1 instead of an image.
          provenance: false
          sbom: false
          tags: |
            ccr.ccs.tencentyun.com/xarchive/vdf-web:latest
            ccr.ccs.tencentyun.com/xarchive/vdf-web:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
