name: Windows 64-bit

# CI runs only for the PR lifecycle. In particular, `closed` is deliberately not
# included: merging the PR creates a push on master, but must not run this build a
# second time. The master workflow is responsible only for release packaging.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

# A new commit supersedes an older run of the same PR. This keeps exactly one
# useful validation run per PR revision instead of spending runners on stale SHAs.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Build GUI
      run: dotnet publish VDF.GUI/VDF.GUI.csproj -c Release -v q --self-contained -r win-x64
    - name: Build CLI
      run: dotnet publish VDF.CLI/VDF.CLI.csproj -c Release -v q --self-contained -r win-x64
    - name: Build Web
      run: dotnet publish VDF.Web/VDF.Web.csproj -c Release -v q --self-contained -r win-x64
    - name: Run Unit Tests
      run: dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release -v q
    - name: Run Web Tests
      run: dotnet test VDF.Web.Tests/VDF.Web.Tests.csproj -c Release -v q
    - name: Run CLI Tests
      run: dotnet test VDF.CLI.Tests/VDF.CLI.Tests.csproj -c Release -v q
    - name: Run GUI Tests
      run: dotnet test VDF.GUI.Tests/VDF.GUI.Tests.csproj -c Release -v q
    - name: Install FFmpeg
      run: choco install ffmpeg -y --no-progress
    - name: Run Integration Tests
      run: dotnet test VDF.IntegrationTests/VDF.IntegrationTests.csproj -c Release -v normal
